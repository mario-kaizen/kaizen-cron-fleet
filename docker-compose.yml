# =============================================================================
# Kaizen Cron Fleet — Active Services
# =============================================================================
# 1. mindbody-sync               | Daily Mindbody→GHL sync (10:00am AEST)
# 2. wodify-sync                 | Daily Wodify→GHL sync (9:00am Sydney AEST = 23:00 UTC)
# 3. funnel-capi-match           | Every 15min: match STRONG funnel widget captures to
#                                  GHL account-created contacts → fire Meta CAPI Lead.
# 4. strong-intro-purchases      | Daily Grow→Lighthouse refresh of intro offer purchase
#                                  counts for STRONG DWY clients (23:00 UTC = 9am Sydney).
# 5. strong-intel-outcome-pull   | Daily STRONG Competitive Intel pull (12:00 UTC).
#                                  Fires after every TZ's "yesterday" is fully complete
#                                  (latest TZ is UTC-10; 12:00 UTC = 02:00 local for them).
#                                  Writes one LocationOutcomeDaily row per studio for
#                                  each studio's local yesterday.
#
# Slimmed 2026-05-13: removed 10 token-heavy / unused services
# (sync-stripe-revenue, detect-wins, smart-scanner, meta-ads-sync,
#  stripe-notion-sync, notion-sync, client-health-engine,
#  client-performance-sync, notification-poller, health-check).
# =============================================================================

services:
  mindbody-sync:
    build: ./cron-http
    environment:
      CRON_NAME: "mindbody-sync"
      CRON_SCHEDULE: "0 0 * * *"
      CRON_ENDPOINT: "/api/cron/sync"
      CRON_SECRET: "${CRON_SECRET}"
      BASE_URL: "https://mindbody.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  wodify-sync:
    build: ./cron-http
    environment:
      CRON_NAME: "wodify-sync"
      CRON_SCHEDULE: "0 23 * * *"  # 9am Sydney AEST (UTC+10)
      CRON_ENDPOINT: "/api/cron/wodify-sync"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  funnel-capi-match:
    build: ./cron-http
    environment:
      CRON_NAME: "funnel-capi-match"
      CRON_SCHEDULE: "*/15 * * * *"  # every 15 min — matcher's GHL window is 30 min
      CRON_ENDPOINT: "/api/cron/capi-match"
      CRON_SECRET: "${FUNNEL_CRON_SECRET}"  # funnel platform has its own secret
      BASE_URL: "https://join.strongpilates.ca"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  strong-intro-purchases:
    build: ./cron-http
    environment:
      CRON_NAME: "strong-intro-purchases"
      CRON_SCHEDULE: "0 23 * * *"  # 9am Sydney AEST = 23:00 UTC — daily refresh of intro offer counts for STRONG DWY clients
      CRON_ENDPOINT: "/api/cron/strong-intro-purchases"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  strong-intel-outcome-pull:
    build: ./cron-http
    environment:
      CRON_NAME: "strong-intel-outcome-pull"
      CRON_SCHEDULE: "0 12 * * *"  # 12:00 UTC daily — after every studio TZ's "yesterday" is done (latest TZ in fleet is UTC-10, which is 02:00 local at 12:00 UTC)
      CRON_ENDPOINT: "/api/cron/strong-intel-outcome-pull"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

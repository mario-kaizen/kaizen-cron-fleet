# =============================================================================
# Kaizen Cron Fleet — Active Services
# =============================================================================
# 1. mindbody-sync               | Daily Mindbody→GHL sync (10:00am AEST)
# 2. wodify-sync                 | Daily Wodify→GHL sync (9:00am Sydney AEST = 23:00 UTC)
# 3. funnel-capi-match           | Every 15min: match STRONG funnel widget captures to
#                                  GHL account-created contacts → fire Meta CAPI Lead.
# 4. strong-intro-purchases      | Daily Grow→Lighthouse refresh of intro offer purchase
#                                  counts for STRONG DWY clients (23:00 UTC = 9am Sydney).
# 5. strong-intel-outcome-pull   | STRONG Competitive Intel pull, 4x daily (02:00,
#                                  05:00, 12:00, 20:00 UTC = 12pm, 3pm, 10pm, 6am
#                                  Sydney). Writes one LocationOutcomeDaily row per
#                                  studio for each studio's local yesterday. Was a
#                                  single 12:00 UTC run until 2026-07-21, which left
#                                  Sydney 22 hours stale and 91 of 130 studios waiting
#                                  over half a day.
# 6. ghl-crm-sync                | Daily per-client GHL CRM pull (contacts +
#                                  opportunities to GhlCrmSnapshot) feeding the client
#                                  pages + portal (19:00 UTC = 5am Sydney AEST).
# 7. launchpad-retention-roster   | Refresh the three BBB Wodify rosters every four hours.
# 8. launchpad-retention-attendance | Refresh BBB attendance and retention signals hourly.
# 9. launchpad-retention-grow     | Refresh BBB Grow context hourly.
# 10. athletex-core-bridge        | Every 5min: release due Athlete X journey
#                                  continuations, retry failed PushPress Core events,
#                                  and enrol pending member backfills. Added 2026-07-25
#                                  after the 07-24 cutover shipped with no scheduler:
#                                  26 continuations sat pending with the first due
#                                  10:03 AEST, and a continuation only releases when
#                                  this route runs, so every mid-journey member would
#                                  have stalled silently.
# 11. launchpad-numbers-warm      | Every 4min: ping the Launchpad numbers route so
#                                  every cache layer stays warm. Warm the route costs
#                                  ~5s; a Lighthouse restart raises that to ~25-30s
#                                  because live Stripe work sits behind it, and this
#                                  ping means no human request ever pays that cost.
#                                  Uses the warm-ping image, not cron-http: the target
#                                  route is GET-only and 405s on cron-http's hardcoded
#                                  POST + x-cron-secret/x-session-secret shape.
#
# Slimmed 2026-05-13: removed 10 token-heavy / unused services
# (sync-stripe-revenue, detect-wins, smart-scanner, meta-ads-sync,
#  stripe-notion-sync, notion-sync, client-health-engine,
#  client-performance-sync, notification-poller, health-check).
# =============================================================================

services:
  mindbody-sync:
    build: ./cron-http
    environment:
      CRON_NAME: "mindbody-sync"
      CRON_SCHEDULE: "0 0 * * *"
      CRON_ENDPOINT: "/api/cron/sync"
      CRON_SECRET: "${CRON_SECRET}"
      BASE_URL: "https://mindbody.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  wodify-sync:
    build: ./cron-http
    environment:
      CRON_NAME: "wodify-sync"
      CRON_SCHEDULE: "0 23 * * *"  # 9am Sydney AEST (UTC+10)
      CRON_ENDPOINT: "/api/cron/wodify-sync"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  funnel-capi-match:
    build: ./cron-http
    environment:
      CRON_NAME: "funnel-capi-match"
      CRON_SCHEDULE: "*/15 * * * *"  # every 15 min — matcher's GHL window is 30 min
      CRON_ENDPOINT: "/api/cron/capi-match"
      CRON_SECRET: "${FUNNEL_CRON_SECRET}"  # funnel platform has its own secret
      BASE_URL: "https://join.strongpilates.ca"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  strong-intro-purchases:
    build: ./cron-http
    environment:
      CRON_NAME: "strong-intro-purchases"
      CRON_SCHEDULE: "0 23 * * *"  # 9am Sydney AEST = 23:00 UTC — daily refresh of intro offer counts for STRONG DWY clients
      CRON_ENDPOINT: "/api/cron/strong-intro-purchases"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  strong-intel-outcome-pull:
    build: ./cron-http
    environment:
      CRON_NAME: "strong-intel-outcome-pull"
      # 02:00, 05:00, 12:00, 20:00 UTC = 12pm, 3pm, 10pm, 6am Sydney (AEST, UTC+10).
      # Four runs, each timed to the moment a block of studio timezones finishes its
      # local day, so every studio's "yesterday" is on the board at each of the four
      # times Mario reads the leaderboard. A single daily run cannot do this: the fleet
      # spans 22 hours of local midnights (Auckland 12:00 UTC round to Los Angeles
      # 07:00 UTC), so whichever hour you pick, the first timezone to finish waits for
      # the last. At 12:00 UTC only Auckland was current and Sydney lagged 22 hours.
      # Each run re-pulls every studio's local yesterday rather than skipping ones
      # already stored. That is deliberate: intro_offer_purchase_date is a DATE field
      # staff can backdate, so the repeat pull picks up late entries the same day.
      CRON_SCHEDULE: "0 2,5,12,20 * * *"
      CRON_ENDPOINT: "/api/cron/strong-intel-outcome-pull"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  ghl-crm-sync:
    build: ./cron-http
    environment:
      CRON_NAME: "ghl-crm-sync"
      CRON_SCHEDULE: "0 19 * * *"  # 5am Sydney AEST (19:00 UTC), clear of the 9am GHL jobs
      CRON_ENDPOINT: "/api/sync/ghl-crm"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  launchpad-retention-roster:
    build: ./cron-http
    environment:
      CRON_NAME: "launchpad-retention-roster"
      CRON_SCHEDULE: "15 */4 * * *"
      CRON_ENDPOINT: "/api/cron/retention-sync?job=roster"
      CRON_SECRET: "${LAUNCHPAD_CRON_SECRET}"
      BASE_URL: "${LAUNCHPAD_BASE_URL}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  launchpad-retention-attendance:
    build: ./cron-http
    environment:
      CRON_NAME: "launchpad-retention-attendance"
      CRON_SCHEDULE: "45 * * * *"
      CRON_ENDPOINT: "/api/cron/retention-sync?job=attendance"
      CRON_SECRET: "${LAUNCHPAD_CRON_SECRET}"
      BASE_URL: "${LAUNCHPAD_BASE_URL}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  launchpad-retention-grow:
    build: ./cron-http
    environment:
      CRON_NAME: "launchpad-retention-grow"
      CRON_SCHEDULE: "25 * * * *"
      CRON_ENDPOINT: "/api/cron/retention-sync?job=grow"
      CRON_SECRET: "${LAUNCHPAD_CRON_SECRET}"
      BASE_URL: "${LAUNCHPAD_BASE_URL}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  athletex-core-bridge:
    build: ./cron-http
    environment:
      CRON_NAME: "athletex-core-bridge"
      # Every 5 min. The route is idempotent and cheap when idle (it returns zero
      # counts unless a continuation is due, an event is retryable, or a member
      # backfill is pending), so the cost of a tight cadence is near nothing while
      # the cost of a slow one is a member's next message arriving hours late.
      CRON_SCHEDULE: "*/5 * * * *"
      CRON_ENDPOINT: "/api/cron/athletex-core-bridge"
      CRON_SECRET: "${CRON_SECRET}"
      SESSION_SECRET: "${SESSION_SECRET}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped

  launchpad-numbers-warm:
    build: ./warm-ping
    environment:
      CRON_NAME: "launchpad-numbers-warm"
      CRON_SCHEDULE: "*/4 * * * *"
      CRON_ENDPOINT: "/api/integrations/launchpad/numbers"
      CRON_SECRET: "${LAUNCHPAD_NUMBERS_API_KEY}"
      BASE_URL: "https://lighthouse.mariopaguio.com"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
      SLACK_CHANNEL_ID: "C0ALM9P8DQD"
    restart: unless-stopped
